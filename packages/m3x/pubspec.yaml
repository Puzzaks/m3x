name: m3x
description: Consolidated umbrella package for the Material 3 eXtended (m3x) Flutter ecosystem (UI, chat, dictionary, core, mesh, storage, and GitHub explorer).
version: 0.0.6
homepage: https://puzzak.page
repository: https://github.com/Puzzaks/m3x/tree/main/packages/m3x
issue_tracker: https://github.com/Puzzaks/m3x/issues
topics:
  - material-design
  - ui
  - flutter
  - ecosystem
  - m3x

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  m3x_core: ^0.0.1
  m3x_dict: ^0.0.2
  m3x_ui: ^0.1.1
  m3x_chat: ^0.2.3
  m3x_mesh: ^1.1.6
  m3x_storage: ^0.0.1
  m3x_gh: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
