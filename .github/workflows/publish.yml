name: Publish to pub.dev

on:
  push:
    tags:
      - '*-v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve package from tag
        id: resolve
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="${TAG%-v*}"
          PKG_DIR="packages/${PKG}"
          if [[ -z "${PKG}" || "${PKG}" == "${TAG}" ]]; then
            echo "::error::Tag '${TAG}' does not match '<package>-v<version>'."
            exit 1
          fi
          if [[ ! -f "${PKG_DIR}/pubspec.yaml" ]]; then
            echo "::error::Package manifest '${PKG_DIR}/pubspec.yaml' not found for tag '${TAG}'."
            exit 1
          fi
          echo "package=${PKG}" >> "$GITHUB_OUTPUT"
          echo "dir=${PKG_DIR}" >> "$GITHUB_OUTPUT"
          echo "Resolved package '${PKG}' at '${PKG_DIR}' from tag '${TAG}'."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: flutter analyze

      - name: Run tests
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: flutter test

      - name: Publish to pub.dev (OIDC)
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: flutter pub publish --force
